<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Firma Digitale Docente - UniMol</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a202c; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Overlay che appare solo se il telefono è in verticale */
    #rotateWarning {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #003366; z-index: 999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px;
    }
    #rotateWarning.hidden { display: none; }
    .rotate-icon { font-size: 50px; margin-bottom: 15px; animation: rotateAnim 2s infinite ease-in-out; }
    @keyframes rotateAnim {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
      100% { transform: rotate(90deg); }
    }
    #rotateWarning h3 { font-size: 20px; margin-bottom: 8px; }
    #rotateWarning p { font-size: 14px; opacity: 0.8; }

    /* Interfaccia orizzontale full screen */
    .app-container { display: flex; flex-direction: column; height: 100vh; padding: 10px 15px; background: #f4f6f9; color: #333; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .header-info { text-align: left; }
    .header-info h2 { font-size: 15px; color: #003366; }
    .header-info p { font-size: 11px; color: #666; }

    .canvas-container { flex: 1; border: 2px dashed #003366; border-radius: 8px; background: #ffffff; position: relative; width: 100%; }
    canvas { width: 100%; height: 100%; border-radius: 6px; cursor: crosshair; }

    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 15px; }
    .btn-group { display: flex; gap: 10px; flex: 1; }
    button { flex: 1; padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-clear { background: #cbd5e0; color: #2d3748; }
    .btn-send { background: #28a745; color: white; }
    #status { font-weight: bold; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- SCHERMATA DI AVVISO IN CASO DI DISPOSITIVO VERTICALE -->
  <div id="rotateWarning">
    <div class="rotate-icon">📱 ➔ 🔄</div>
    <h3>Ruota il dispositivo in Orizzontale</h3>
    <p>Per firmare agevolmente, per favore ruota lo smartphone di lato.</p>
  </div>

  <!-- INTERFACCIA PRINCIPALE DI FIRMA -->
  <div class="app-container">
    <div class="header">
      <div class="header-info">
        <h2 id="docenteTitle">✍️ Firma Attestato UniMol</h2>
        <p id="insegnamentoSub">Traccia la tua firma con il dito sull'intera superficie bianca</p>
      </div>
      <div id="status"></div>
    </div>

    <div class="canvas-container">
      <canvas id="sigCanvas"></canvas>
    </div>

    <div class="footer">
      <div class="btn-group">
        <button type="button" class="btn-clear" onclick="clearCanvas()">❌ Cancella</button>
        <button type="button" class="btn-send" onclick="submitSignature()">✅ Invia Firma</button>
      </div>
    </div>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const insegnamento = urlParams.get('insegnamento') || '';
  const docente = urlParams.get('docente') || '';
  const scriptUrl = urlParams.get('api') || '';

  if (docente) {
    document.getElementById('docenteTitle').innerText = `Firma: ${docente}`;
    document.getElementById('insegnamentoSub').innerText = insegnamento;
  }

  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  const rotateWarning = document.getElementById('rotateWarning');
  let isDrawing = false;
  let hasDrawn = false;

  // Gestione dell'orientamento dello schermo
  function checkOrientation() {
    const isPortrait = window.innerHeight > window.innerWidth;
    if (isPortrait) {
      rotateWarning.classList.remove('hidden');
    } else {
      rotateWarning.classList.add('hidden');
      setTimeout(resizeCanvas, 100); // Ricalcola la tela dopo la rotazione
    }
  }

  // Tenta di forzare la rotazione automatica ove supportato (Chrome Android)
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }

  window.addEventListener('resize', () => {
    checkOrientation();
    resizeCanvas();
  });
  window.addEventListener('orientationchange', checkOrientation);

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    
    // Mantiene il contenuto tracciato durante il ridimensionamento
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(canvas, 0, 0);

    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2, 2);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#000080';

    if (hasDrawn) {
      ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDrawing(e) {
    isDrawing = true;
    hasDrawn = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDrawing);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
    document.getElementById('status').innerText = '';
  }

  function submitSignature() {
    if (!hasDrawn) {
      alert("Traccia prima la tua firma nel riquadro!");
      return;
    }

    if (!scriptUrl) {
      alert("Errore: URL API mancante.");
      return;
    }

    const statusDiv = document.getElementById('status');
    statusDiv.style.color = '#003366';
    statusDiv.innerText = "Invio in corso...";

    const base64Data = canvas.toDataURL('image/png');

    fetch(scriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        insegnamento: insegnamento,
        docente: docente,
        image: base64Data
      })
    }).then(() => {
      statusDiv.style.color = '#28a745';
      statusDiv.innerHTML = "✅ Registrata!";
      setTimeout(() => {
        alert("Firma inviata con successo! Puoi chiudere questa pagina.");
      }, 300);
    }).catch(err => {
      statusDiv.style.color = 'red';
      statusDiv.innerText = "Errore invio!";
    });
  }

  // Controllo iniziale al caricamento
  checkOrientation();
</script>
</body>
</html>
