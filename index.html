<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Firma Digitale Docente - UniMol</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
    html, body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #f4f6f9; 
      color: #333; 
      width: 100%;
      height: 100%;
      overflow-y: auto; /* Permette lo scroll se lo schermo è molto basso */
    }
    
    body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .card { 
      background: #ffffff; 
      border-radius: 12px; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 650px; 
      padding: 12px 16px; 
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-info { text-align: center; }
    .header-info h2 { font-size: 16px; color: #003366; }
    .header-info p { font-size: 11px; color: #666; }

    /* Canvas flessibile: si adatta all'altezza dello schermo */
    .canvas-container { 
      border: 2px dashed #003366; 
      border-radius: 8px; 
      background: #ffffff; 
      width: 100%; 
      height: 45vh; /* Usa il 45% dell'altezza dello schermo disponibile */
      min-height: 140px;
      max-height: 280px;
      position: relative;
      touch-action: none;
    }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      border-radius: 6px; 
      cursor: crosshair; 
      display: block;
    }

    .btn-group { 
      display: flex; 
      gap: 10px; 
      width: 100%;
      margin-top: 4px;
    }
    
    button { 
      flex: 1; 
      padding: 12px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 14px; 
      cursor: pointer; 
      touch-action: manipulation;
    }
    
    .btn-clear { background: #e2e8f0; color: #4a5568; }
    .btn-send { background: #28a745; color: #ffffff; }

    #status { 
      text-align: center; 
      font-weight: bold; 
      font-size: 12px; 
      min-height: 16px;
    }

    /* Ottimizzazione specifica quando il telefono viene ruotato in orizzontale */
    @media (orientation: landscape) and (max-height: 500px) {
      body { padding: 5px; justify-content: flex-start; }
      .card { padding: 8px 12px; gap: 4px; }
      .header-info h2 { font-size: 14px; }
      .header-info p { display: none; } /* Nasconde il sottotitolo per guadagnare spazio */
      .canvas-container { height: 55vh; min-height: 120px; }
      button { padding: 8px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-info">
      <h2 id="docenteTitle">✍️ Firma Attestato UniMol</h2>
      <p id="insegnamentoSub">Traccia la tua firma con il dito nel riquadro sottostante</p>
    </div>

    <div class="canvas-container">
      <canvas id="sigCanvas"></canvas>
    </div>

    <div id="status"></div>

    <div class="btn-group">
      <button type="button" class="btn-clear" onclick="clearCanvas()">❌ Cancella</button>
      <button type="button" class="btn-send" onclick="submitSignature()">✅ Invia Firma</button>
    </div>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const insegnamento = urlParams.get('insegnamento') || '';
  const docente = urlParams.get('docente') || '';
  const scriptUrl = urlParams.get('api') || '';

  if (docente) {
    document.getElementById('docenteTitle').innerText = `Firma: ${docente}`;
    document.getElementById('insegnamentoSub').innerText = insegnamento;
  }

  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let hasDrawn = false;

  function initCanvas() {
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2, 2);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#000080';
  }

  window.addEventListener('load', initCanvas);
  window.addEventListener('resize', () => {
    if (!hasDrawn) initCanvas();
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(initCanvas, 200);
  });

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDrawing(e) {
    isDrawing = true;
    hasDrawn = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    e.preventDefault();
  }

  function stopDrawing() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', stopDrawing);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
    document.getElementById('status').innerText = '';
  }

  function submitSignature() {
    if (!hasDrawn) {
      alert("Traccia prima la tua firma nel riquadro!");
      return;
    }

    if (!scriptUrl) {
      alert("Errore: URL API mancante.");
      return;
    }

    const statusDiv = document.getElementById('status');
    statusDiv.style.color = '#003366';
    statusDiv.innerText = "Invio in corso...";

    const base64Data = canvas.toDataURL('image/png');

    fetch(scriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        insegnamento: insegnamento,
        docente: docente,
        image: base64Data
      })
    }).then(() => {
      statusDiv.style.color = '#28a745';
      statusDiv.innerHTML = "✅ Firma inviata con successo!";
      setTimeout(() => {
        alert("Firma salvata correttamente su Google Drive. Puoi chiudere questa schermata.");
      }, 300);
    }).catch(err => {
      statusDiv.style.color = 'red';
      statusDiv.innerText = "Errore durante l'invio. Riprova.";
    });
  }
</script>
</body>
</html>
